<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1728"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00e5ff" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="vig" cx="50%" cy="45%" r="72%">
      <stop offset="55%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#02040a" stop-opacity="0.9"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- esquinas -->
  <g fill="none" stroke="#00e5ff" stroke-opacity="0.5" stroke-width="2">
    <path d="M28 60V28h32"/>
    <path d="M772 60V28h-32"/>
    <path d="M28 390v32h32"/>
    <path d="M772 390v32h-32"/>
  </g>

  <!-- hexágono + monograma (centrado) -->
  <polygon points="400,105 484,153 484,247 400,295 316,247 316,153"
    fill="#00e5ff" fill-opacity="0.07" stroke="#00e5ff" stroke-opacity="0.85" stroke-width="2.5"/>
  <polygon points="400,130 462,165 462,235 400,270 338,235 338,165"
    fill="none" stroke="#00e5ff" stroke-opacity="0.28" stroke-width="1.5"/>
  <text x="400" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
    font-size="66" font-weight="900" letter-spacing="3" fill="#00e5ff" filter="url(#glow)">MG</text>

  <!-- etiqueta -->
  <text x="744" y="418" text-anchor="end" font-family="monospace" font-size="15"
    letter-spacing="2" fill="#8fa5cc" opacity="0.75">STORE // 2025</text>

  <rect width="800" height="450" fill="url(#vig)"/>
</svg>
