<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0" stop-color="#0d1b33"/>
      <stop offset="1" stop-color="#05080f"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#4a9eff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="128" cy="128" r="126" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="126" fill="none" stroke="#1c2c4a" stroke-width="3"/>
  <circle cx="128" cy="128" r="118" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.7" filter="url(#glow)"/>
  <g stroke="#1c2c4a" stroke-width="1" opacity="0.5">
    <line x1="0" y1="64" x2="256" y2="64"/>
    <line x1="0" y1="128" x2="256" y2="128"/>
    <line x1="0" y1="192" x2="256" y2="192"/>
    <line x1="64" y1="0" x2="64" y2="256"/>
    <line x1="128" y1="0" x2="128" y2="256"/>
    <line x1="192" y1="0" x2="192" y2="256"/>
  </g>
  <text x="128" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="4" fill="#00e5ff" filter="url(#glow)">MC</text>
</svg>
